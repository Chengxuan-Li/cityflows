name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # TASK-090: check, city and the e2e groups run side by side; deploy waits for check.
  # The e2e groups are balanced by duration in playwright.config.ts.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Real-city imports (bench/city-cache.ts), reused while sources and extracts are unchanged.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
      - run: npm run test:city
      - run: npm run test:traffic

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CITYFLOWS_E2E_GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-${{ matrix.group }}
          path: test-results
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build
        env:
          CITYFLOWS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_TILE_URL: ${{ vars.VITE_TILE_URL }}
          VITE_OVERPASS_URL: ${{ vars.VITE_OVERPASS_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
