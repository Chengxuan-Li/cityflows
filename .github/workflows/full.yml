name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [scheduled, exit-unchecked]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node bench/task147/phase-experiment.mjs
      - if: matrix.variant == 'exit-unchecked'
        run: sed -i 's/if (!blocked)$/if (!blocked && f !== 2)/' src/sim/rail-crossings.ts
      - run: node --experimental-strip-types --import ./bench/register.ts bench/task147/counter.ts ${{ matrix.variant }}
