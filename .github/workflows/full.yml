name: Parking candidate strict verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  city:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:city -- --shard=${{ matrix.shard }}/2
  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/T70-station-furniture.spec.ts --project chromium
        env:
          CITYFLOWS_TEST_PORT: 5344
          CITYFLOWS_PRODUCTION_TEST_PORT: 5444
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parking-station-results
          path: test-results
