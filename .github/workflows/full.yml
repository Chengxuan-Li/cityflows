name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --import ./bench/register.ts --import ./bench/task147/binding-hook.mjs bench/task147/counter.ts trace
