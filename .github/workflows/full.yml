name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  morning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [2-no-warning, 2-no-tail, 2-no-red]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node bench/task147/facility-experiment.mjs ${{ matrix.variant }}
      - run: node --experimental-strip-types --import ./bench/register.ts bench/task147/counter.ts ${{ matrix.variant }}
