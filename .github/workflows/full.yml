name: TASK-146 geometry probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-results/task146
      - name: Baseline render regression (expected red)
        run: npx vitest run --project unit tests/render/T25-transition-markings.test.ts > test-results/task146/regression-before.log 2>&1
        continue-on-error: true
      - name: Real CityFlows views
        run: |
          npm run dev -- --host 127.0.0.1 --port 5346 --mode test > test-results/task146/vite.log 2>&1 &
          node --experimental-strip-types --import ./bench/register.ts ./bench/task146-shots.ts before
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: task146-geometry-baseline
          path: test-results/task146
          retention-days: 7
