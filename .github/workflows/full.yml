name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  morning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [paired-pr, paired-parking]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - if: matrix.variant == 'paired-pr'
        uses: actions/checkout@v7
        with:
          ref: dcdaa10de43c3f94fe870cb475d52b40c6f472df
          path: old-crossing
      - if: matrix.variant == 'paired-pr'
        run: |
          cp old-crossing/src/importers/osm/{index,lots,places}.ts src/importers/osm/
          cp old-crossing/src/network/compile.ts src/network/
      - run: node bench/task147/paired-trams.mjs
      - run: node --experimental-strip-types --import ./bench/register.ts bench/task147/counter.ts ${{ matrix.variant }}
