name: TASK147 clock verification
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [check, validation, traffic, all]
        default: validation
permissions:
  contents: read
jobs:
  focused:
    if: inputs.scope == 'traffic' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --project unit tests/sim/T75-operating-crossings.test.ts tests/network/T76-trams.test.ts
  traffic:
    if: inputs.scope != 'validation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - shell: bash
        run: npm run test:traffic:light 2>&1 | tee traffic.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clock-traffic
          path: traffic.log
  footprints:
    if: inputs.scope != 'validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - run: node --experimental-strip-types --import ./bench/register.ts ./test-results/physical-footprints/probe.ts clock-actual-time 36000 > footprints.log 2>&1
      - run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('test-results/physical-footprints/report.json','utf8'));if(r.collision)process.exit(1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clock-footprints
          path: |
            footprints.log
            test-results/physical-footprints/*.json
  check:
    if: inputs.scope != 'traffic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - shell: bash
        run: npm run check 2>&1 | tee check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clock-check
          path: check.log
  city:
    if: inputs.scope == 'validation' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - shell: bash
        run: npm run test:city 2>&1 | tee city.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clock-city
          path: city.log
