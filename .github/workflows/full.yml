name: Parking access investigation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        revision: [aa4006c50fc0097a26755cc6144e3ac8c3f53594, e99c03c1ba7c4513b2b8289c1c15ab08b35ed4f5, 5475921ba343db2f248c193eb31b2356bcce1f00]
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: source
      - run: python ../harness/bench/parking-inspect.py
        working-directory: source
      - run: cp ../harness/bench/*parking-passive.mjs bench/ && node --experimental-strip-types --import ./bench/register.ts bench/run-parking-passive.mjs
        working-directory: source
      - uses: actions/upload-artifact@v7
        with:
          name: parking-trace-${{ matrix.revision }}
          path: source/parking-trace.json
