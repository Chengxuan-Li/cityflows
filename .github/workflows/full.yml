name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node bench/task147/egress-priority.mjs
      - run: node bench/task147/keep-exit-storage.mjs
      - run: node --experimental-strip-types --import ./bench/register.ts bench/task147/counter.ts compact-with-storage
