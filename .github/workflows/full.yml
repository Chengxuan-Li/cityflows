name: TASK-146 strict candidate verification
on:
  workflow_dispatch:
    inputs:
      paint_patch:
        description: Base64 candidate patch applied only on the runner
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: 2
      CITYFLOWS_TEST_PORT: 5346
      CITYFLOWS_PRODUCTION_TEST_PORT: 5446
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply exact candidate without pushing product files
        env:
          PAINT_PATCH_B64: ${{ inputs.paint_patch }}
        run: |
          mkdir -p test-results/task146
          python - <<'PY'
          import os,base64,subprocess,hashlib,pathlib
          patch=base64.b64decode(os.environ['PAINT_PATCH_B64'])
          pathlib.Path('test-results/task146/candidate.patch').write_bytes(patch)
          pathlib.Path('test-results/task146/candidate.sha256').write_text(hashlib.sha256(patch).hexdigest())
          subprocess.run(['git','apply'],input=patch,check=True)
          PY
          npx prettier --write bench/task146-audit.ts bench/task146-shots.ts
      - name: Ordinary strict check
        run: npm run check > test-results/task146/check.log 2>&1
      - name: Ordinary strict city tier
        if: always()
        run: npm run test:city > test-results/task146/city.log 2>&1
      - name: Ordinary strict light browser tier
        if: always()
        run: npm run test:e2e:light > test-results/task146/e2e-light.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: task146-strict-${{ github.run_id }}
          path: test-results
          retention-days: 7
