name: Parking access investigation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        revision: [aa4006c, e99c03c, 5475921]
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: source
      - run: cp ../harness/bench/*parking-passive.mjs bench/ && node --experimental-strip-types --import ./bench/register.ts bench/run-parking-passive.mjs
        working-directory: source
      - uses: actions/upload-artifact@v7
        with:
          name: parking-trace-${{ matrix.revision }}
          path: source/parking-trace.json
