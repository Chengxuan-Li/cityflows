name: Parking geometry verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: [aa4006c50fc0097a26755cc6144e3ac8c3f53594, e99c03c1ba7c4513b2b8289c1c15ab08b35ed4f5]
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: source
      - run: python ../harness/bench/street-inspect.py && npx vitest run --project city tests/render/V117-visual-fixes.test.ts
        working-directory: source
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: street-${{ matrix.revision }}
          path: |
            source/*-lamps.json
            source/*-curbs.json

