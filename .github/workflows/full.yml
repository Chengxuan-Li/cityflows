name: TASK147 bounded compact claim verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - shell: bash
        run: npm run test:traffic:light 2>&1 | tee traffic.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-claim-traffic
          path: traffic.log
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - run: node --experimental-strip-types --import ./bench/register.ts --import ./test-results/147/claim-hook.mjs ./test-results/physical-footprints/probe.ts compact-claim 36000 > footprints.log 2>&1
      - run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('test-results/physical-footprints/report.json','utf8'));if(r.collision)process.exit(1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-claim-physical
          path: |
            footprints.log
            test-results/physical-footprints/*.json
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - shell: bash
        run: npm run check 2>&1 | tee check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-claim-check
          path: check.log
