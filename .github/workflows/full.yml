name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  morning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        omit: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --import ./bench/register.ts bench/task147/counter.ts omit-${{ matrix.omit }}
