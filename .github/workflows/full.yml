name: Full

# The full tier (lead, 2026-11-10): the whole traffic tier with full demand and the whole e2e
# suite in five duration-balanced groups (playwright.config.ts). It runs at checkpoints (a
# pushed `checkpoint-*` tag), on demand (Actions, "Run workflow"), and nightly when main has
# new commits. A red full run blocks new merges until it is fixed.
on:
  push:
    tags: ['checkpoint-*']
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
      - run: npm run check

  city:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
      - run: npm run test:city
      - run: npm run test:traffic

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [a, b, c, d, e, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CITYFLOWS_E2E_GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-full-${{ matrix.group }}
          path: test-results
          retention-days: 7

  # TASK-172: advisory report, Munich at 0.15 to 10:00 on seeds 1 to 3, mode choice off and on, with
  # TASK-154's drain criteria. It never fails the workflow; it compares with the last report on main.
  seed-report:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
      - name: Download the previous report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          for run in $(gh run list --workflow full.yml --branch main --status completed --limit 14 --json databaseId --jq '.[].databaseId'); do
            [ "$run" = "$CURRENT_RUN" ] && continue
            if gh run download "$run" --name seed-report --dir previous; then break; fi
          done
      - name: Run the report
        continue-on-error: true
        run: |
          previous=()
          if [ -f previous/seed-report.json ]; then previous=(--previous previous/seed-report.json); fi
          npm run seed-report -- --out seed-report "${previous[@]}"
      - name: Job summary
        if: ${{ !cancelled() && hashFiles('seed-report/seed-report.md') != '' }}
        run: cat seed-report/seed-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('seed-report/seed-report.json') != '' }}
        with:
          name: seed-report
          path: seed-report
          retention-days: 14
