name: TASK147 actual-lane differential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic:
    strategy:
      fail-fast: false
      matrix:
        variant: [selector, known-clearance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - if: matrix.variant == 'selector'
        run: python -c "from pathlib import Path;p=Path('src/sim/rail-crossings.ts');s=p.read_text();s=s.replace('        if (offsets[last]! + segmentLength(segments[last]!) < clear) blocked = true;', '');p.write_text(s)"
      - shell: bash
        run: npm run test:traffic:light 2>&1 | tee traffic.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-${{ matrix.variant }}-traffic
          path: traffic.log
  physical:
    strategy:
      fail-fast: false
      matrix:
        variant: [selector, known-clearance]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/cityflows
          key: city-imports-${{ hashFiles('src/**', 'fixtures/osm/**', 'package-lock.json') }}
          restore-keys: city-imports-
      - if: matrix.variant == 'selector'
        run: python -c "from pathlib import Path;p=Path('src/sim/rail-crossings.ts');s=p.read_text();s=s.replace('        if (offsets[last]! + segmentLength(segments[last]!) < clear) blocked = true;', '');p.write_text(s)"
      - run: node --experimental-strip-types --import ./bench/register.ts --import ./test-results/147/actual-lane-hook.mjs ./test-results/physical-footprints/probe.ts actual-lane 36000 > footprints.log 2>&1
      - run: node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('test-results/physical-footprints/report.json','utf8'));if(r.collision)process.exit(1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-${{ matrix.variant }}-physical
          path: |
            footprints.log
            test-results/physical-footprints/*.json
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - shell: bash
        run: npm run check 2>&1 | tee check.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-check
          path: check.log
