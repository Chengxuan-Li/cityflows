name: Parking access verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:traffic:light
  diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --import ./bench/register.ts bench/parking-morning-review.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: parking-morning
          path: parking-morning.json
