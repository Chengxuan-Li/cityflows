name: Isolated crossing diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  morning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [coordinated, pedestrians]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure the three-hour Munich morning
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = pedestrians ]; then
            npx vitest run --project traffic tests/traffic/T53-munich-pedestrians.test.ts
          else
            node --experimental-strip-types --import ./bench/register.ts bench/task147/counter.ts "$VARIANT"
          fi
