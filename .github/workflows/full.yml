name: Parking final strict city gates
on: workflow_dispatch
permissions:
  contents: read
jobs:
  city:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:city -- --shard=${{ matrix.shard }}/2
