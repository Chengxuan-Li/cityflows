name: Parking late candidate verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  city-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect changed full-geometry pins; keep semantic assertions strict
        run: |
          git show 3334568:tests/hash-probe.ts > tests/hash-probe.ts
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('tests').rglob('*.test.ts'):
              s=p.read_text()
              s=s.replace("import { expect, test } from 'vitest';", "import { test } from 'vitest';\nimport { expect } from '../hash-probe';")
              p.write_text(s)
          PY
          npm run test:city
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:traffic:light
  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/T70-station-furniture.spec.ts --project chromium
        env:
          CITYFLOWS_TEST_PORT: 5344
          CITYFLOWS_PRODUCTION_TEST_PORT: 5444
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parking-late-station-results
          path: test-results
