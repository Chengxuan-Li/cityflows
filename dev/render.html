<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityFlows renderer</title>
    <style>
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        margin: 0;
        height: 100dvh;
        background: #202a2b;
        color: #e3e9e5;
        font:
          13px system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        padding: 0.65rem 1rem;
        background: #182021;
        border-bottom: 1px solid #465150;
      }
      header strong {
        font-weight: 650;
      }
      header span {
        color: #afbeb9;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="fixture">CityFlows renderer</strong>
      <span>Synthetic traffic, not observed traffic</span>
      <span>Drag to pan · Scroll to zoom · Click to select</span>
      <span id="status" aria-live="polite"></span>
    </header>
    <canvas aria-label="Traffic map"></canvas>
    <script type="module" src="/dev/render.ts"></script>
  </body>
</html>
