<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityFlows renderer</title>
    <style>
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        margin: 0;
        height: 100dvh;
        background: #202a2b;
        color: #e3e9e5;
        font:
          13px system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.75rem 1.5rem;
        padding: 0.65rem 1rem;
        background: #182021;
        border-bottom: 1px solid #465150;
      }
      header strong {
        font-weight: 650;
      }
      header span {
        color: #afbeb9;
      }
      #attribution {
        position: absolute;
        right: 0;
        bottom: 0;
        padding: 0.2rem 0.4rem;
        background: #182021;
        color: inherit;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      .aircraft-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1rem;
        align-items: center;
      }
      .aircraft-scroll {
        overflow: auto;
        background: var(--aircraft-ground);
      }
      .aircraft-preview {
        position: relative;
        display: grid;
        min-width: 1036px;
        grid-template-columns: repeat(7, minmax(148px, 1fr));
        grid-auto-rows: clamp(205px, calc((100dvh - 87px) / 3), 290px);
        color: #202a32;
      }
      .aircraft-scroll[data-lighting='night'] .aircraft-preview {
        color: #e3e9f4;
      }
      .aircraft-preview canvas {
        position: absolute;
        inset: 0;
        cursor: default;
        pointer-events: none;
      }
      .aircraft-preview canvas[hidden] {
        display: none;
      }
      .aircraft-entry {
        display: grid;
        align-content: end;
        gap: 3px;
        border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        padding-bottom: 12px;
        text-align: center;
      }
      .aircraft-entry span {
        font-size: 11px;
        opacity: 0.8;
      }
      .aircraft-scale {
        position: relative;
        margin: 16px;
        border-top: 1px solid currentColor;
        color: #202a32;
        font-size: 11px;
        line-height: 19px;
        text-align: center;
      }
      .aircraft-scroll[data-lighting='night'] .aircraft-scale {
        color: #e3e9f4;
      }
      .aircraft-scale::before,
      .aircraft-scale::after {
        position: absolute;
        top: 0;
        width: 1px;
        height: 4px;
        background: currentColor;
        content: '';
      }
      .aircraft-scale::before {
        left: 0;
      }
      .aircraft-scale::after {
        right: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="fixture">CityFlows renderer</strong>
      <span>Synthetic traffic, not observed traffic</span>
      <span>Drag to pan · Scroll to zoom · Click to select</span>
      <label hidden><input id="tiles" type="checkbox" /> Map tiles</label>
      <span id="status" aria-live="polite"></span>
    </header>
    <canvas aria-label="Traffic map"></canvas>
    <a id="attribution" hidden></a>
    <script type="module" src="/dev/render.ts"></script>
  </body>
</html>
